name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APKs (TV + Mobile)
        working-directory: app/native
        run: ./gradlew assembleTvDebug assembleMobileDebug --no-daemon

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyOnTV-TV-debug
          path: app/native/app/build/outputs/apk/tv/debug/*.apk

      - name: Upload Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyOnTV-Mobile-debug
          path: app/native/app/build/outputs/apk/mobile/debug/*.apk
